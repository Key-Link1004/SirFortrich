<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thank you, Sir Fortrich</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&display=swap">
  <style>
    :root {
      --kraft: #d6b788;
      --paper: #fbf5e6;
      --ink: #2b2a4a;
      --pen: #d62828;
      --blue: #2a4d9b;
      --tape: rgba(255, 226, 120, .78);
      --shadow: rgba(60, 40, 10, .35);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --kraft: #4a3b2c;
        --paper: #efe6d2;
        --shadow: rgba(0, 0, 0, .55)
      }
    }

    :root[data-theme="dark"] {
      --kraft: #4a3b2c;
      --paper: #efe6d2;
      --shadow: rgba(0, 0, 0, .55)
    }

    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: var(--kraft);
      background-image: radial-gradient(rgba(0, 0, 0, .07) 1px, transparent 1.2px), radial-gradient(rgba(255, 255, 255, .08) 1px, transparent 1.2px);
      background-size: 7px 7px, 11px 11px;
      font-family: "Caveat", "Bradley Hand", cursive;
      color: var(--ink);
      overflow-x: hidden
    }

    #fx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 9
    }

    #fx i {
      position: absolute;
      top: -30px;
      animation: fall linear forwards
    }

    @keyframes fall {
      to {
        transform: translateY(112vh) rotate(500deg)
      }
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 20px 56px
    }

    .screen {
      display: none
    }

    .screen.on {
      display: block;
      animation: in .4s both
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateY(10px)
      }
    }

    .type {
      font-family: "Special Elite", "Courier New", monospace
    }

    .strip {
      background: var(--paper);
      padding: 14px 16px 12px;
      transform: rotate(-1.5deg);
      box-shadow: 0 6px 14px var(--shadow);
      clip-path: polygon(0 4%, 3% 0, 7% 5%, 12% 0, 18% 4%, 24% 0, 31% 5%, 38% 0, 45% 4%, 52% 0, 60% 5%, 68% 0, 75% 4%, 83% 0, 90% 5%, 96% 0, 100% 4%, 100% 96%, 96% 100%, 90% 95%, 83% 100%, 75% 96%, 68% 100%, 60% 95%, 52% 100%, 45% 96%, 38% 100%, 31% 95%, 24% 100%, 18% 96%, 12% 100%, 7% 95%, 3% 100%, 0 96%);
      margin-top: 3vh
    }

    .strip small {
      display: block;
      font-size: 15px;
      letter-spacing: .08em;
      color: var(--blue)
    }

    .strip h1 {
      margin: 2px 0 0;
      font-size: clamp(40px, 12vw, 56px);
      line-height: .95
    }

    .hint {
      margin: 22px 4px 8px;
      font-size: 23px
    }

    .items {
      display: grid;
      gap: 26px;
      margin-top: 10px
    }

    .it {
      position: relative;
      border: 0;
      font: inherit;
      color: inherit;
      cursor: pointer;
      text-align: center;
      background: none;
      padding: 0;
      transition: transform .15s
    }

    .it:active {
      transform: scale(.96)
    }

    .it:before {
      content: "";
      position: absolute;
      top: -12px;
      left: 50%;
      width: 84px;
      height: 26px;
      margin-left: -42px;
      background: var(--tape);
      transform: rotate(-4deg);
      z-index: 2;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .15)
    }

    .pol {
      background: #fff;
      padding: 12px 12px 10px;
      box-shadow: 0 8px 18px var(--shadow);
      width: 78%
    }

    .pol .img {
      height: 120px;
      display: grid;
      place-items: center;
      font-size: 64px;
      background: linear-gradient(135deg, #ffd6a5, #fdffb6)
    }

    .pol .cap,
    .env .cap {
      font-size: 28px;
      font-weight: 700;
      margin-top: 6px
    }

    .i1 {
      transform: rotate(-4deg)
    }

    .i1 .pol {
      margin-right: auto
    }

    .i2 {
      transform: rotate(3deg)
    }

    .env {
      margin-left: auto;
      width: 82%;
      padding: 22px 14px 12px;
      background: linear-gradient(155deg, transparent 49%, rgba(0, 0, 0, .08) 50%) top/100% 55% no-repeat, linear-gradient(25deg, transparent 49%, rgba(0, 0, 0, .06) 50%) bottom/100% 100% no-repeat, #f0e2c0;
      box-shadow: 0 8px 18px var(--shadow)
    }

    .env .em {
      font-size: 52px
    }

    .i3 {
      transform: rotate(-2deg)
    }

    .sticky {
      width: 70%;
      margin-right: auto;
      background: #fff176;
      padding: 20px 14px 14px;
      box-shadow: 0 8px 16px var(--shadow);
      border-bottom-right-radius: 26px 8px
    }

    .sticky .em {
      font-size: 44px
    }

    .sticky .cap {
      font-size: 28px;
      font-weight: 700
    }

    .i3:before {
      background: rgba(214, 40, 40, .7);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-left: -10px;
      top: -8px;
      transform: none
    }

    .it.done:after {
      content: "DONE ✔";
      position: absolute;
      right: -4px;
      bottom: 22px;
      transform: rotate(-12deg);
      font: 700 22px "Special Elite", monospace;
      color: var(--pen);
      border: 3px solid var(--pen);
      border-radius: 8px;
      padding: 0 8px;
      background: rgba(255, 255, 255, .85)
    }

    .last {
      display: none;
      width: 100%;
      margin-top: 30px;
      padding: 14px;
      border: 0;
      background: var(--pen);
      color: #fff;
      font: 700 30px "Caveat", cursive;
      box-shadow: 0 6px 0 #8f1818;
      border-radius: 14px;
      cursor: pointer;
      animation: wig 1.5s ease-in-out infinite
    }

    .last.show {
      display: block
    }

    @keyframes wig {
      25% {
        transform: rotate(-1.5deg)
      }

      75% {
        transform: rotate(1.5deg)
      }
    }

    :focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 3px
    }

    .back {
      border: 0;
      background: none;
      font: inherit;
      font-size: 24px;
      color: inherit;
      cursor: pointer;
      padding: 4px 0
    }

    h2 {
      font-size: 40px;
      margin: 4px 0 12px;
      line-height: 1
    }

    .page {
      background: var(--paper);
      padding: 20px 18px;
      box-shadow: 0 10px 22px var(--shadow);
      position: relative;
      transform: rotate(.6deg);
      color: var(--ink)
    }

    .page:before {
      content: "";
      position: absolute;
      top: -12px;
      left: 50%;
      width: 90px;
      height: 26px;
      margin-left: -45px;
      background: var(--tape);
      transform: rotate(3deg)
    }

    .lined {
      background-image: repeating-linear-gradient(transparent 0 33px, rgba(42, 77, 155, .2) 33px 34px);
      font-size: 27px;
      line-height: 34px
    }

    .lined p {
      margin: 0 0 17px
    }

    .sign {
      text-align: right;
      font-weight: 700;
      font-size: 32px
    }

    .tip {
      text-align: center;
      font-size: 20px;
      margin-top: 12px;
      opacity: .85
    }

    /* polaroid grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 14px;
      margin: 8px 0 16px
    }

    .g {
      border: 0;
      background: #fff;
      padding: 9px 9px 8px;
      box-shadow: 0 6px 14px var(--shadow);
      cursor: pointer;
      position: relative;
      font: inherit;
      color: var(--ink)
    }

    .g:nth-child(odd) {
      transform: rotate(-3deg)
    }

    .g:nth-child(even) {
      transform: rotate(2.5deg)
    }

    .g .img {
      height: 92px;
      display: grid;
      place-items: center;
      font-size: 48px;
      background: #2b2a4a;
      color: #fff;
      filter: brightness(.7);
      transition: filter 1.1s, background 1.1s
    }

    .g.dev .img {
      filter: none;
      background: linear-gradient(135deg, #ffd6a5, #caffbf)
    }

    .g .c {
      font-size: 21px;
      font-weight: 700;
      margin-top: 4px;
      min-height: 24px
    }

    .card {
      background: var(--paper);
      padding: 14px 16px;
      box-shadow: 0 6px 14px var(--shadow);
      font-size: 26px;
      line-height: 1.1;
      transform: rotate(-.8deg);
      min-height: 84px;
      color: var(--ink)
    }

    .card b {
      display: block;
      font-size: 30px
    }

    /* red pen */
    .essay {
      font-size: 26px;
      line-height: 1.3
    }

    .essay h3 {
      margin: 0 0 10px;
      font-size: 30px;
      text-decoration: underline
    }

    .sn {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      padding: 6px 4px;
      cursor: pointer;
      border-radius: 8px
    }

    .sn:hover {
      background: rgba(214, 40, 40, .06)
    }

    .sn.on {
      text-decoration: underline wavy var(--pen);
      text-underline-offset: 5px
    }

    .mk {
      display: block;
      color: var(--pen);
      font-size: 25px;
      font-weight: 700;
      margin: 0 0 2px 22px;
      transform: rotate(-2deg);
      animation: in .4s both
    }

    .grade {
      display: none;
      text-align: center;
      margin-top: 14px;
      color: var(--pen);
      font: 700 74px "Caveat", cursive;
      line-height: 1
    }

    .grade small {
      display: block;
      font-size: 26px
    }

    .grade.on {
      display: block;
      animation: slam .5s cubic-bezier(.2, 1.6, .4, 1) both
    }

    @keyframes slam {
      from {
        transform: scale(3) rotate(-25deg);
        opacity: 0
      }

      to {
        transform: rotate(-8deg)
      }
    }

    /* finale */
    .fin {
      text-align: center;
      padding-top: 3vh
    }

    .fin h1 {
      font-size: clamp(44px, 13vw, 62px);
      line-height: .95;
      margin: 6px 0
    }

    .col {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 16px 0
    }

    .col span {
      background: #fff;
      padding: 6px 6px 16px;
      font-size: 36px;
      box-shadow: 0 5px 10px var(--shadow)
    }

    .col span:nth-child(1) {
      transform: rotate(-8deg)
    }

    .col span:nth-child(2) {
      transform: rotate(4deg) translateY(6px)
    }

    .col span:nth-child(3) {
      transform: rotate(-3deg)
    }

    .col span:nth-child(4) {
      transform: rotate(7deg) translateY(4px)
    }

    .fin p {
      font-size: 28px;
      line-height: 1.15;
      margin: 8px 0
    }

    .go {
      display: inline-block;
      margin: 10px 4px 0;
      padding: 8px 22px;
      border: 0;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font: 700 24px "Caveat", cursive;
      cursor: pointer
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    body[data-subject="tle"] {
      --kraft: #d6b788;
      --paper: #fbf5e6;
      --ink: #2b2a4a;
      --pen: #d62828;
      --blue: #2a4d9b;
      --tape: rgba(255, 226, 120, .78)
    }

    body[data-subject="christian-living"] {
      --kraft: #aab99d;
      --paper: #fbf5e6;
      --ink: #344437;
      --pen: #a56d36;
      --blue: #687b61;
      --tape: rgba(229, 202, 127, .82)
    }

    body[data-subject="math-filipino"] {
      --kraft: #a96f75;
      --paper: #fff1d7;
      --ink: #3d243c;
      --pen: #a82e42;
      --blue: #4c4c85;
      --tape: rgba(242, 206, 123, .82)
    }

    body[data-subject="science"] {
      --kraft: #80a899;
      --paper: #edf5e9;
      --ink: #183e46;
      --pen: #c85d3b;
      --blue: #247986;
      --tape: rgba(224, 201, 103, .82)
    }

    body[data-subject="mapeh-computer"] {
      --kraft: #d29b72;
      --paper: #fff1dc;
      --ink: #34365d;
      --pen: #c64f58;
      --blue: #4955a6;
      --tape: rgba(255, 224, 130, .84)
    }

    body[data-subject="tle"] {
      --kraft: #bd805f;
      --paper: #f7eddb;
      --ink: #3d3a31;
      --pen: #bd4632;
      --blue: #526b53;
      --tape: rgba(227, 196, 125, .84)
    }

    body[data-subject="unspecified"] {
      --kraft: #b4a78d;
      --paper: #fbf5e8;
      --ink: #373b43;
      --pen: #a9584d;
      --blue: #526a7c;
      --tape: rgba(238, 216, 157, .84)
    }

    .site-footer {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 20px 24px;
      text-align: center;
      color: var(--ink);
      font-size: 17px
    }

    .site-footer a {
      color: var(--blue);
      text-underline-offset: 3px
    }

    .site-footer .type {
      font-size: 13px
    }

    .pol,
    .g,
    .col span {
      background: var(--paper)
    }

    .pol .img,
    .g.dev .img {
      background: linear-gradient(135deg, var(--tape), var(--paper))
    }

    .env {
      background: linear-gradient(155deg, transparent 49%, rgba(0, 0, 0, .08) 50%) top/100% 55% no-repeat,
        linear-gradient(25deg, transparent 49%, rgba(0, 0, 0, .06) 50%) bottom/100% 100% no-repeat,
        var(--kraft)
    }

    .sticky {
      background: var(--tape)
    }

    .i3:before {
      background: var(--pen)
    }

    .lined {
      background-image: repeating-linear-gradient(transparent 0 33px, color-mix(in srgb, var(--blue) 24%, transparent) 33px 34px)
    }

    .g .img {
      background: var(--blue)
    }

    .g.dev .img {
      filter: none
    }

    .sn:hover {
      background: color-mix(in srgb, var(--pen) 8%, transparent)
    }
  </style>
</head>

<body data-subject="tle">
  <div id="fx" aria-hidden="true"></div>
  <main>

    <section id="home" class="screen on">
      <div class="strip"><small class="type" id="classLabel">TLE · SCRAPBOOK EDITION</small>
        <h1 id="ttl"></h1>
      </div>
      <p class="hint">Open everything. We made it just for you ✂️</p>
      <div class="items">
        <button class="it i1" data-go="gifts">
          <div class="pol">
            <div class="img">🎁</div>
            <div class="cap">Gifts</div>
          </div>
        </button>
        <button class="it i2" data-go="letter">
          <div class="env">
            <div class="em">💌</div>
            <div class="cap">A letter</div>
          </div>
        </button>
        <button class="it i3" data-go="pen">
          <div class="sticky">
            <div class="em">🖍️</div>
            <div class="cap">Surprise!</div>
          </div>
        </button>
      </div>
      <button class="last" id="lastBtn" data-go="finale">📖 Turn to the last page</button>
    </section>

    <section id="gifts" class="screen">
      <button class="back" data-go="home">← back to scrapbook</button>
      <h2>Gifts from the class</h2>
      <p class="hint" style="margin-top:0" id="gHint">Tap each photo to develop it.</p>
      <div class="grid" id="grid"></div>
      <div class="card" id="gCard" hidden></div>
      <div class="tip" id="gCnt"></div>
    </section>

    <section id="letter" class="screen">
      <button class="back" data-go="home">← back to scrapbook</button>
      <div class="page lined" id="pg" style="margin-top:16px"></div>
      <div class="tip" id="skip">tap the paper to finish writing</div>
    </section>

    <section id="pen" class="screen">
      <button class="back" data-go="home">← back to scrapbook</button>
      <h2>Time to grade! 🖍️</h2>
      <p class="hint" style="margin-top:0">Tap each sentence with your red pen.</p>
      <div class="page essay" id="essay">
        <h3></h3>
      </div>
      <div class="grade" id="grade">A+<small>Flawless. No notes.</small></div>
    </section>

    <section id="finale" class="screen">
      <div class="fin">
        <div class="type" style="font-size:15px;letter-spacing:.1em;color:var(--blue)">THE LAST PAGE</div>
        <h1 id="fT"></h1>
        <div class="col"><span>📖</span><span>🖋️</span><span>☕</span><span>💛</span></div>
        <p id="finMessage"></p>
        <p style="font-weight:700;font-size:32px" id="fFrom"></p>
        <button class="go" id="more">🎉 confetti</button><button class="go" data-go="home"
          style="background:var(--blue)">close the book</button>
      </div>
    </section>

  </main>
  <footer class="site-footer">
<a href="https://www.facebook.com/profile.php?id=61594992337205" aria-label="Facebook page">
  Contact Us.
</a>  </footer>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var TO = (q.get("to") || "Sir Fortrich").slice(0, 40);
      var FROM = (q.get("from") || "Esme").slice(0, 40);
      var SUBJECT_LABEL = "TLE";
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var $ = function (s) { return document.querySelector(s) };
      var done = { gifts: 0, letter: 0, pen: 0 }, timers = [];
      function later(f, ms) { var t = setTimeout(f, ms); timers.push(t) }
      $("#ttl").textContent = "Thank you, " + TO + "!";
      $("#fT").textContent = "Thank you, " + TO + "!"; $("#fFrom").textContent = "— " + FROM;
      $("#classLabel").textContent = SUBJECT_LABEL + " · SCRAPBOOK EDITION";
      $("#finMessage").textContent = "Your lessons helped me believe in who I can become.";
      document.title = "Thank you, " + TO + " — from " + FROM;
      function confetti(n) {
        if (reduce) return; var c = [getComputedStyle(document.body).getPropertyValue("--pen"), "#ffd166", getComputedStyle(document.body).getPropertyValue("--blue"), "#06d6a0", "#fff"];
        for (var i = 0; i < n; i++) {
          var s = document.createElement("i");
          if (i % 4 === 0) { s.textContent = ["✨", "📖", "💛"][i % 3]; s.style.fontSize = "22px" } else { s.style.width = "9px"; s.style.height = "13px"; s.style.background = c[i % 5]; s.style.borderRadius = "1px" }
          s.style.left = Math.random() * 100 + "%"; s.style.animationDuration = (2.6 + Math.random() * 2.4) + "s"; s.style.animationDelay = Math.random() * .8 + "s";
          $("#fx").appendChild(s); setTimeout(function (e) { e.remove() }, 6500, s)
        }
      }
      function show(id) {
        timers.forEach(clearTimeout); timers = [];
        document.querySelectorAll(".screen").forEach(function (s) { s.classList.toggle("on", s.id === id) });
        scrollTo(0, 0);
        if (id === "letter") write();
        if (id === "finale") confetti(70);
        if (id === "home") refresh();
      }
      function refresh() {
        document.querySelectorAll(".it").forEach(function (b) { b.classList.toggle("done", !!done[b.dataset.go === "gifts" ? "gifts" : b.dataset.go]) });
        var all = done.gifts && done.letter && done.pen; $("#lastBtn").classList.toggle("show", !!all);
        if (all && !refresh.p) { refresh.p = 1; confetti(30) }
      }
      document.addEventListener("click", function (e) { var b = e.target.closest("[data-go]"); if (b) show(b.dataset.go) });
      $("#more").onclick = function () { confetti(80) };

      /* gifts */
      var G = [["📚", "A lasting lesson", "For the ideas you shared that will stay with me beyond class."], ["🌱", "Room to grow", "Thank you for giving me space to learn at my own pace."], ["✨", "A little spark", "You make even a challenging lesson feel possible."], ["💛", "A grateful heart", "I feel lucky to have learned from you."]];
      var seen = {};
      G.forEach(function (g, i) {
        var b = document.createElement("button"); b.className = "g";
        b.innerHTML = '<div class="img">?</div><div class="c">tap me</div>'; b.setAttribute("aria-label", "Photo " + (i + 1));
        b.onclick = function () {
          b.classList.add("dev"); b.querySelector(".img").textContent = g[0]; b.querySelector(".c").textContent = g[1]; seen[i] = 1;
          var c = $("#gCard"); c.hidden = false; c.innerHTML = "<b></b><span></span>"; c.firstChild.textContent = g[0] + " " + g[1]; c.lastChild.textContent = g[2];
          var n = Object.keys(seen).length; $("#gCnt").textContent = n + " of 4 opened";
          if (n === 4) { done.gifts = 1; confetti(30); $("#gCnt").textContent = "Every little thank-you opened! Back to the scrapbook ✨" }
        };
        $("#grid").appendChild(b)
      });

      /* letter */
      var L = ["Dear " + TO + ",", "I didn't know a caring teacher could change the way I see myself and what I can become.", "You reminded me that every question is worth asking and every challenge is a chance to grow.", "In your class, I learned more than lessons; I learned to be patient with myself and brave enough to keep trying.", "Thank you for noticing my effort, encouraging my curiosity, and helping me find my own strength.", "Your kindness will stay with me long after this school year ends.", "With love and gratitude, " + FROM + " 💛"];
      var skipFn = null, typing = false;
      function write() {
